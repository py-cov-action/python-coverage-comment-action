repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff format
        name: ruff format
        entry: uv run ruff format --force-exclude
        types: [python]
        language: system

      - id: ruff check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        types: [python]
        language: system

      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        require_serial: true
        types_or: [python, pyi]

      - id: sync-readme-examples
        name: sync README examples
        entry: uv run python .github/scripts/sync_readme_examples.py
        language: system
        files: ^(README\.md|docs/examples/.*)$
        pass_filenames: false

      - id: check-documented-inputs
        name: check documented inputs
        entry: uv run python .github/scripts/check_documented_inputs.py
        language: system
        files: ^(README\.md|action\.ya?ml|docs/examples/.*)$
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        types: [yaml]
        # Unlike zizmor, actionlint reads every file it's given as a workflow,
        # so action.yml is not in this list.
        files: (\.github/workflows/.*\.ya?ml$)|(docs/examples/.*\.ya?ml$)
        language: system
        require_serial: true

      - id: zizmor
        name: zizmor
        entry: uv run zizmor --fix=all
        types: [yaml]
        files: (\.github/(workflows/.*|dependabot.ya?ml))|(action\.ya?ml)$|(docs/examples/.*\.ya?ml$)
        language: system
        require_serial: true
        args:
          - "--persona=auditor"
